spring.application.name=time-manager

# 0.0.0.0 = принимать подключения не только с этого ПК, но и с телефона в сети
server.address=0.0.0.0
server.port=8080
# Показывать текст ошибки в ответе API (чтобы фронтенд мог вывести его)
server.error.include-message=always

# ---- Логин и пароль для входа на сайт ----
# Настоящие значения кладутся в файл config/application.properties
# в корне проекта (он в .gitignore и не попадает на GitHub) — Spring Boot
# подхватывает его автоматически и он переопределяет значения ниже.
# Пустой пароль = вход без пароля (только для домашней сети!)
app.auth.username=admin
app.auth.password=

# База H2 хранится в файле ./data/timemanager.mv.db рядом с проектом,
# поэтому данные не пропадают после перезапуска
spring.datasource.url=jdbc:h2:file:./data/timemanager
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Веб-консоль базы (http://localhost:8080/h2-console). Выключена, т.к. сайт
# доступен из сети, а консоль позволяет выполнять любой SQL. Включай только для отладки.
spring.h2.console.enabled=false
